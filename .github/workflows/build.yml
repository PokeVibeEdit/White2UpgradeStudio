name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\White2UpgradeEditor.sln

      - name: Build (Release)
        run: dotnet build .\White2UpgradeEditor.sln -c Release --no-restore

      - name: Publish Windows x64 app
        run: dotnet publish .\White2UpgradeEditor\White2UpgradeEditor.csproj -c Release -r win-x64 --self-contained false -o .\publish\White2UpgradeStudio

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: White2UpgradeStudio-win-x64
          path: publish/White2UpgradeStudio/
          if-no-files-found: error
