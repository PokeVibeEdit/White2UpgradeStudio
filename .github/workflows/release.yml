name: Preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish versioned Windows x64 editor and updater
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Use a semantic version tag such as v0.1.1-alpha.1" }
          dotnet restore .\White2UpgradeEditor.sln
          dotnet publish .\White2UpgradeEditor\White2UpgradeEditor.csproj -c Release -r win-x64 --self-contained false -p:Version=$version -o .\publish\White2UpgradeStudio
          dotnet publish .\White2UpgradeUpdater\White2UpgradeUpdater.csproj -c Release -r win-x64 --self-contained false -p:Version=$version -o .\publish\White2UpgradeStudio
          Compress-Archive -Path .\publish\White2UpgradeStudio\* -DestinationPath .\White2UpgradeStudio-win-x64.zip -Force
          $hash = (Get-FileHash .\White2UpgradeStudio-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'White2UpgradeStudio-win-x64.zip.sha256'), "$hash  White2UpgradeStudio-win-x64.zip")

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            White2UpgradeStudio-win-x64.zip
            White2UpgradeStudio-win-x64.zip.sha256
