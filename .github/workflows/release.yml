name: Preview release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          dotnet restore .\White2UpgradeEditor.sln
          dotnet publish .\White2UpgradeEditor\White2UpgradeEditor.csproj -c Release -r win-x64 --self-contained false -o .\publish\White2UpgradeStudio
          Compress-Archive -Path .\publish\White2UpgradeStudio\* -DestinationPath .\White2UpgradeStudio-win-x64.zip -Force

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: White2UpgradeStudio-win-x64.zip
