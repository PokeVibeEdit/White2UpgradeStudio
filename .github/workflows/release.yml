name: Automatic preview release

# Every push to main builds, tests, and publishes exactly one preview release.
# A push containing multiple commits produces one release for the resulting head.
# Tags created by releases do not trigger this workflow again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel a build after it has begun producing a release.
concurrency:
  group: automatic-preview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Choose monotonically increasing preview version
        id: version
        shell: pwsh
        run: |
          # Run numbers increase for each execution of this workflow.
          # This tag is also the version stamped into both executables.
          $version = "0.2.$env:GITHUB_RUN_NUMBER-alpha.1"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore .\White2UpgradeEditor.sln

      - name: Build (Release)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build .\White2UpgradeEditor.sln -c Release --no-restore "-p:Version=$env:RELEASE_VERSION"

      - name: Updater self-tests
        shell: pwsh
        run: dotnet run --project .\White2UpgradeUpdater\White2UpgradeUpdater.csproj -c Release --no-build -- --self-test

      - name: Package editor and updater with matching version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish .\White2UpgradeEditor\White2UpgradeEditor.csproj -c Release -r win-x64 --self-contained false "-p:Version=$env:RELEASE_VERSION" -o .\publish\White2UpgradeStudio
          dotnet publish .\White2UpgradeUpdater\White2UpgradeUpdater.csproj -c Release -r win-x64 --self-contained false "-p:Version=$env:RELEASE_VERSION" -o .\publish\White2UpgradeStudio

          $zip = 'White2UpgradeStudio-win-x64.zip'
          Compress-Archive -Path .\publish\White2UpgradeStudio\* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "$zip.sha256"), "$hash  $zip")

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: White 2 Upgrade Studio ${{ steps.version.outputs.tag }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            White2UpgradeStudio-win-x64.zip
            White2UpgradeStudio-win-x64.zip.sha256
